[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen2care"
version = "0.1.0"
description = "Screening-to-care loop for a breast-screening clinic"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "jinja2",
    "python-dotenv",
    "pydantic",
    "bcrypt",
    "pyjwt",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]
